<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ícono: mismos colores que tokens.css (un SVG suelto no puede leer variables CSS) -->
  <style>
    .a { fill: #2563EB; } .b { fill: #38BDF8; }
    @media (prefers-color-scheme: dark) { .a { fill: #60A5FA; } }
  </style>
  <rect class="b" x="10" y="10" width="18" height="18" rx="4"/>
  <rect class="a" x="4" y="4" width="18" height="18" rx="4"/>
</svg>
